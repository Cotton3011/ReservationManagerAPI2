<!-- HTML5としてブラウザへ文書形式を伝える-->
<!DOCTYPE html>

<!--画面の言語を日本語として設定-->
<html lang="ja">

<!--画面の設定情報の領域-->
<head>
    <!--日本語を正しく表示する文字コードを設定-->
    <meta charset="UTF-8">

    <!--スマホでも画面幅に合わせて表示する-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--ブラウザタブに表示するタイトルを設定-->
    <title>Reservation Manager</title>
</head>

<!--ブラウザに表示する情報の領域-->
<body>
    <!--アプリケーションの見出しを表示-->
    <header>
        <!--アプリケーション名を表示-->
        <h1>Reservation Manager</h1>
    </header>

    <!--この画面の主な内容を置く-->
    <main>
        <!--次のStepでログインフォームを置く領域を用意する-->
        <section id="login-screen">
            <h2>ログイン</h2>
            
            <p>フロントエンドの土台を準備</p>
        </section>
    </main>

</body>

</html>
