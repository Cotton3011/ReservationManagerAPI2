#gitHub Actions上で表示するWorkflow名
name: Build and Test

#すべてのブランチへのpush時に実行する
on:
  push:

  #GitHub画面から必要な時に手動実行できるようにする
  workflow_dispatch:

#CIで実行する処理
jobs:
  build:
    #GitHubが用意するUbuntu環境で実行する
    runs-on: ubuntu-latest

    steps:
      #リポジトリのコードをRunnerへ取得する
      - name: Checkout source code
        uses: actions/checkout@v6

      #プロジェクトと同じ.NET 8 SDKを利用する
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      #APIとテストの依存パッケージをまとめて復元する
      - name: Restore dependencies
        run: dotnet restore ReservationManagerAPI2.sln

      #Release構成でソリューション全体をビルドする
      - name: Build
        run: dotnet build ReservationManagerAPI2.sln --configuration Release --no-restore

      #ビルド済みのテストを実行して、予約重複判定を検証する
      - name: Test
        run: dotnet test ReservationManagerAPI2.sln --configuration Release --no-build --no-restore

  deploy:
    #BuildとTestが成功した後だけ実行する
    needs: build

    #mainブランチへのpushだけをデプロイ対象にする
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      #Deployジョブでもリポジトリを取得するために必要
      contents: read

      #Azure用のDIDCトークンを発行する
      id-token: write

    steps:
      #Deploy用のRunnerへソースコードを取得する
      - name: Checkout source code
        uses: actions/checkout@v6

      #GitHub SecretsのIDを使ってAzureへ安全にログインする
      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID}}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID}}

      #Docker Hubへイメージをpushするためにログインする
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME}}
          password: ${{ secrets.DOCKERHUB_TOKEN}}

      #Dockerfileを使うビルダーを準備する
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      #commit固有タグでイメージを作成し、Docker Hubへpushする
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: cotton3011/reservation-manager-api:${{ github.sha}}

      #Azure Container Appsを新しいイメージへ更新する
      - name: Deploy image to Azure Container Apps
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ca-reservation-manager-api \
              --resource-group rg-reservation-manager-japaneast \
              --image docker.io/cotton3011/reservation-manager-api:${{ github.sha}}