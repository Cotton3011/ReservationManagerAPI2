#gitHub Actions上で表示するWorkflow名
name: Build and Test

#すべてのブランチへのpush時に実行する
on:
  push:

#CIで実行する処理
jobs:
  build:
    #GitHubが用意するUbuntu環境で実行する
    runs-on: ubuntu-latest

    steps:
      #リポジトリのコードをRunnerへ取得する
      - name: Checkout source code
        uses: actions/checkout@v6

      #プロジェクトと同じ.NET 8 SDKを利用する
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      #APIとテストの依存パッケージをまとめて復元する
      - name: Restore dependencies
        run: dotnet restore ReservationManagerAPI2.sln

      #Release構成でソリューション全体をビルドする
      - name: Build
        run: dotnet build ReservationManagerAPI2.sln --configuration Release --no-restore

      #ビルド済みのテストを実行して、予約重複判定を検証する
      - name: Test
        run: dotnet test ReservationManagerAPI2.sln --configuration Release --no-build --no-restore

  deploy:
    #BuildとTestが成功した後だけ実行する
    needs: build

    #mainブランチへのpushだけをデプロイ対象にする
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      #Azure用のDIDCトークンを発行する
      id-token: write

    steps:
      #GitHub SecretsのIDを使ってAzureへ安全にログインする
      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID}}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID}}

      #Azureへログインできたことだけを確認する
      - name: Verify Azure login
        uses: azure/cli@v2
        with:
          inlineScript: az account show --output table